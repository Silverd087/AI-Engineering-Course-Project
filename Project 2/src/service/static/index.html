<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Librarian</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #1f1d1a;
    --muted: #726e67;
    --accent: #1f5f4a;
    --accent-ink: #ffffff;
    --idk: #b4511b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--card);
    color: var(--text);
  }
  button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .answer { white-space: pre-wrap; margin: 0 0 14px; }
  .answer.idk { color: var(--idk); }
  .sources { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
  .sources li { padding: 4px 0; border-top: 1px solid var(--border); }
  .sources li:first-child { border-top: none; }
  .sources .cited { color: var(--text); font-weight: 600; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 12px; }
  .fb { display: flex; gap: 8px; margin-top: 12px; }
  .fb button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 10px;
    font-size: 13px;
  }
  .fb button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #status { color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>The Librarian</h1>
    <p class="sub">Ask about MedTech course syllabi — prerequisites, grading, content, Gen AI policy. Answers cite the source chunk, or say "I don't know".</p>

    <form id="ask-form">
      <input id="question" type="text" placeholder="e.g. What is the prerequisite for CS434?" autocomplete="off" required />
      <button id="submit-btn" type="submit">Ask</button>
    </form>

    <p id="status" hidden></p>

    <div id="result" hidden>
      <div class="card">
        <p id="answer" class="answer"></p>
        <ul id="sources" class="sources"></ul>
        <p id="meta" class="meta"></p>
        <div class="fb">
          <button id="fb-up" type="button">👍 Helpful</button>
          <button id="fb-down" type="button">👎 Not helpful</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const form = document.getElementById('ask-form');
  const input = document.getElementById('question');
  const submitBtn = document.getElementById('submit-btn');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const answerEl = document.getElementById('answer');
  const sourcesEl = document.getElementById('sources');
  const metaEl = document.getElementById('meta');
  const fbUp = document.getElementById('fb-up');
  const fbDown = document.getElementById('fb-down');

  let currentRequestId = null;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    submitBtn.disabled = true;
    statusEl.hidden = false;
    statusEl.textContent = 'Searching...';
    resultEl.hidden = true;
    fbUp.classList.remove('active');
    fbDown.classList.remove('active');

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      if (!res.ok) throw new Error('Request failed (' + res.status + ')');
      const data = await res.json();
      renderResult(data);
    } catch (err) {
      statusEl.textContent = 'Something went wrong: ' + err.message;
      return;
    }
    statusEl.hidden = true;
    submitBtn.disabled = false;
  });

  function renderResult(data) {
    currentRequestId = data.request_id;
    answerEl.textContent = data.answer;
    answerEl.className = 'answer' + (data.said_idk ? ' idk' : '');

    sourcesEl.innerHTML = '';
    for (const s of data.sources) {
      const li = document.createElement('li');
      li.className = s.cited ? 'cited' : '';
      li.textContent = '[' + s.number + '] ' + (s.header || s.chunk_id) +
        (s.cited ? ' (cited)' : '') + ' — score ' + s.score.toFixed(3);
      sourcesEl.appendChild(li);
    }

    metaEl.textContent = 'retrieval ' + data.retrieval_ms + 'ms · generation ' +
      data.llm_ms + 'ms · total ' + data.total_ms + 'ms';

    resultEl.hidden = false;
  }

  async function sendFeedback(helpful, btn, otherBtn) {
    if (!currentRequestId) return;
    btn.classList.add('active');
    otherBtn.classList.remove('active');
    try {
      await fetch('/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ request_id: currentRequestId, helpful }),
      });
    } catch (err) {
      // best-effort; feedback failing shouldn't block the UI
    }
  }

  fbUp.addEventListener('click', () => sendFeedback(true, fbUp, fbDown));
  fbDown.addEventListener('click', () => sendFeedback(false, fbDown, fbUp));
</script>
</body>
</html>
