[project]
name = "migration-operator"
version = "0.1.0"
description = "LangGraph agent that migrates Python codebases off deprecated APIs, with a sandbox, human checkpoint and trajectory eval."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.8.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "sandbox", "eval"]

[tool.pytest.ini_options]
# Only our own tests. The sample repos in sandbox/fixtures have their own
# test suites that the *agent* runs; pytest must never collect them here.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
]
